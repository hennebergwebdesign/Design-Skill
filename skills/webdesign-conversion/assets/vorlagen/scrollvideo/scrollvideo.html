<!-- Markup. Poster ist ein echtes Bild, der Text steht im HTML, nie nur im Video. -->
<section class="scrollvideo" data-scrollvideo data-src="/media/produkt-sequenz.mp4">
  <img
    class="scrollvideo__poster"
    src="/media/produkt-poster.webp"
    width="1600"
    height="900"
    alt="Produkt in der Ausgangsposition"
    fetchpriority="high"
  />
  <div class="scrollvideo__text">
    <h2>Überschrift als echter HTML Text</h2>
    <p>Die Aussage des Videos steht hier ebenfalls als Text, damit sie ohne Video verständlich bleibt.</p>
  </div>
</section>
